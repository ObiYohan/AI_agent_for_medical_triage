[project]
name = "AI_agent_for_medical_triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johan", email = "obiyohan@free.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "dagshub>=0.7.3",
    "datasets>=5.1.0",
    "en-core-web-md",
    "fr-core-news-md",
    "ipykernel>=7.4.0",
    "mlflow>=3.18.0",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "trl>=1.17.1",
]

[tool.uv.build-backend]
module-name = "projet_14"

[tool.uv.sources]
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[project.scripts]
projet-14 = "projet_14:main"
rgpd-anonymize = "projet_14.rgpd:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Tests de l'API : module api/main.py et paquet src/projet_14, sans installer le projet
pythonpath = ["src", "api"]
