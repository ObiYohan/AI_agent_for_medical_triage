# Démonstration locale : vLLM (GPU) + API FastAPI
# Lancement : docker compose up -d --build   (premier démarrage : image vLLM ~10 Go, puis modèle 3,4 Go depuis le Hub)
# Nom fixe : la pile lancée à la main et celle déployée par la CD sont la même (un seul GPU, un seul port 8080)
name: p14

services:
  vllm:
    image: vllm/vllm-openai:v0.32.0
    command:
      # Modèle fusionné SFT + DPO v3, sur Hugging Face Hub (dépôt privé), à une révision fixe : reproductible
      - --model=${MODEL:-0biyohan/qwen3-1.7b-medical-qcm-fr}
      - --revision=${MODEL_REVISION:-476fed3104b92d446e5c915a6adea7338825c255}
      - --served-model-name=qwen3-medical
      - --max-model-len=2048
      - --gpu-memory-utilization=0.8  # ~1 Go du GPU est déjà pris par l'affichage Windows
    environment:
      HF_TOKEN: ${HF_TOKEN:?Définir HF_TOKEN (jeton Hugging Face en lecture) dans le fichier .env}
    volumes:
      - hf-cache:/root/.cache/huggingface  # le modèle n'est téléchargé qu'une fois
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Pas de port publié : vLLM n'est joignable que par l'API, sur le réseau interne de compose
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s  # téléchargement (premier démarrage) et chargement du modèle
    restart: unless-stopped

  api:
    # En développement : image construite localement (docker compose up -d --build)
    # En déploiement (CD) : image publiée par la CI sur GHCR, à la version du commit (API_IMAGE)
    image: ${API_IMAGE:-p14-api}
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_KEY: ${API_KEY:?Définir API_KEY dans le fichier .env}
      VLLM_URL: http://vllm:8000
      MODEL_NAME: qwen3-medical
      AUDIT_LOG: /logs/audit.jsonl
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/logs  # journal d'audit, conservé hors du conteneur
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
